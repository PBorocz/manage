[project]
name = "manage"
version = "0.0.1"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pydantic>=2.5.3,<3",
    "python-dotenv>=1.0.0,<2",
    "pyyaml~=6.0",
    "requests>=2.31.0,<3",
    "rich>=13.2.0,<14",
    "urllib3>=2.5.0,<3",
]

[project.scripts]
manage = "manage.cli:main"

[dependency-groups]
dev = [
    "pysnooper>=1.1.1,<2",
    "pytest>=7.2.1,<8",
    "pytest-git>=1.7.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.poetry_bumpversion.file."manage/__init__.py"]

[tool.poe]
verbosity = 2

[tool.poe.tasks]
#-------------------------------------------------------------------------------
# 0: GENERAL Task
#-------------------------------------------------------------------------------
test = "pytest"
run = "poetry run manage"

#-------------------------------------------------------------------------------
# 1: Version update (aka "bump")
#-------------------------------------------------------------------------------
VERSION = [
  "_poetry_version",
  "_update_readme_version",
  "_git_add_version",
  "_git_commit",
]
_update_readme_version = "update_readme_version" # Uses pyproject.toml to update README.md
_git_add_version	   = "git add pyproject.toml manage/__init__.py README.md"
_git_commit			   = "git commit -m 'Bump step commit (from poe)'"

#-------------------------------------------------------------------------------
# 2: Build
#-------------------------------------------------------------------------------
BUILD = [
  "_clean",
  "_poetry_lock_check",
  "_poetry_lock_update",
  "_poetry_build",
]
_clean				= "rm -rf build *.egg-info"
_poetry_lock_check	= "poetry check --lock"
_poetry_lock_update	= "poetry lock --no-update"
_poetry_build		= "poetry build"

#-------------------------------------------------------------------------------
# 3: Release
#-------------------------------------------------------------------------------
RELEASE	= [
  "_git_create_tag",
  "_git_push_to_github",
  "_git_create_release",
]
_git_push_to_github	= "git push --follow-tags"

[tool.poe.tasks._poetry_version]
shell = "poetry version $bump_level"

[[tool.poe.tasks._poetry_version.args]]
  name    = "bump_level"
  help    = "The semantic version to push new version to, eg. patch, minor, major etc."
  default = "patch"

[tool.poe.tasks._git_create_tag]
interpreter = "fish"
shell = """
  set release_version (grep "version =" pyproject.toml | head -1 | awk -F'\"' '{print $2}')
  git tag -a $release_version --message $release_version
"""

[tool.poe.tasks._git_create_release]
interpreter = "fish"
shell = """
  set release_version (grep "version =" pyproject.toml | head -1 | awk -F'\"' '{print $2}')
  gh release create "$release_version" --title "$release_version"
  """

[tool.poe.tasks.upgrade]
# For a particular package: uv sync --upgrade-package <foo>
help = "Update all packages to most current versions"
shell = """
  uv sync --upgrade --quiet
  """
